<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Everywear | Shoe Info</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body { 
            background-image: url('image/BgBall.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed;
            background-color: #d5c5e0;
            font-family: Arial, Helvetica, sans-serif; 
            color: #000000;
        }

        .container { 
            width: 95%; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        a { 
            text-decoration: none; 
            color: inherit; 
        }
        
        /* --- Header Navigation --- */
        .main-header { 
            background-color: #000000b0; 
            color: #ffffff; 
            padding: 1px 0; 
        }

        .header-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 300px;
        }

        .header-nav { 
            display: flex; 
            gap: 30px; 
            font-size: 13px; 
            font-weight: bold; 
            text-transform: uppercase; 
        }

        .logo-image { 
            height: 60px; 
            width: auto; 
            display: block;
            transform: scale(1.5); 
        }

        /* This will overlay the Contact link without affecting the navbar spacing */
        .contact-link-wrapper {
            position: relative;
        }

        .contact-link-wrapper a {
            position: absolute;
            left: 30px; /* This is the exact gap between About and Contact */
            top: 0;
            white-space: nowrap;
        }

        /* --- Informative Article Section --- */
        .article-section { 
            display: flex; 
            gap: 50px; 
            margin: 50px auto; 
            background: #ffffff7e; 
            padding: 50px; 
            border-radius: 8px; 
            border: 1px solid #dddddd; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .article-image { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
        }

        .article-image img { 
            max-width: 100%; 
            max-height: 500px; 
            object-fit: contain; 
            border-radius: 8px;
        }
        
        .article-info { 
            flex: 1; 
        }

        .shoe-title { 
            font-size: 36px; 
            font-weight: 900;
            margin-bottom: 15px; 
            color: #661c8e;
            text-transform: uppercase;
        }

        /* --- Fast Facts Box --- */
        .quick-facts {
            background-color: #f9f9f94a;
            border-left: 4px solid #661c8e;
            padding: 15px 20px;
            margin-bottom: 30px;
        }

        .quick-facts p {
            margin-bottom: 5px;
            font-size: 15px;
        }

        .quick-facts span {
            font-weight: bold;
            color: #000000;
        }

        /* --- Main Description --- */
        .shoe-history {
            font-size: 16px;
            color: #000000;
            text-align: justify;
        }

        .shoe-history p {
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background-color: #661c8e;
            color: #ffffff;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 13px;
        }

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            /* Tablet View */
            .header-container { gap: 100px; }
            .logo-image { height: 65px; }
            
            .article-section { 
                padding: 30px; 
                gap: 30px; 
            }

            .products-grid { 
                grid-template-columns: repeat(2, 1fr);
                gap: 30px 15px; 
            }
        }

        @media (max-width: 600px) {
            .header-container { gap: 20px; padding: 0 10px; }
            .header-nav { gap: 10px; }
            .header-nav a { font-size: 11px; white-space: nowrap; }
            .logo-image { height: 50px; }

            .article-section {
                flex-direction: column;
                margin: 20px 15px;
                padding: 20px;
                gap: 20px;
            }
            
            .shoe-title { font-size: 28px; }
            .article-image img { max-height: 300px; }

            .products-grid { 
                grid-template-columns: repeat(1, 1fr);
                gap: 25px 0; 
                margin: 30px 0;
            }
            .product-title { font-size: 16px; }
            .product-price { font-size: 13px; }
            .image-wrapper { height: 250px; }
        }
    </style>
</head>
<body>
