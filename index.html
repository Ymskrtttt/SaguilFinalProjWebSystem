<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Everywear | Home</title>
    
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        
        /* --- Global Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('image/BgBall.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed;
            background-color: #d5c5e0;
            font-family: Arial, Helvetica, sans-serif; 
            color: #000000;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- Header Navigation --- */
        .main-header {
            background-color: #000000b0; 
            color: #ffffff;
            padding: 1px 0; 
        }

        .header-container {
          display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 300px;
        }

        .header-nav {
            display: flex;
            gap: 30px;
              font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff; 
        }

      

        /* Logo Placeholder (if image fails) */
        .header-logo .logo-placeholder {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            padding: 5px 25px;
            border: 2px solid #ffffff; 
            border-radius: 50px;
        }

        .logo-image {
            height: 80px; 
            width: auto;  
            display: block;
            transform: scale(1.5);
        }
        /* This will overlay the Contact link without affecting the navbar spacing */
        .contact-link-wrapper {
            position: relative;
        }

        .contact-link-wrapper a {
            position: absolute;
            left: 30px; /* This is the exact gap between About and Contact */
            top: 0;
            white-space: nowrap;
        }

        /* --- Hero Banner Section --- */
        .hero-container {
            padding: 30px 0;
        }

        .hero-banner {
            position: relative;
            width: 100%;
            aspect-ratio: 21 / 9; 
            background-color: #cccccc; 
            background-image: url('image/Hb.avif'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        /* Dark Overlay for better text readability */
       
        .hero-content {
            position: relative;
            z-index: 1;
        }

        .hero-content h3 {
            font-size: 2vw;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .hero-content h1 {
            font-size: 8vw;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            text-transform: uppercase;
        }

        .hero-content h2 {
            font-size: 2.5vw;
            font-weight: bold;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1.5vw;
            margin-top: 15px;
            letter-spacing: 1px;
        }

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            /* Tablet View */
            .header-container { gap: 100px; }
            .logo-image { height: 65px; }
        }

        @media (max-width: 600px) {
            /* Mobile View */
            .header-container {
                gap: 20px; 
                padding: 0 10px;
            }
            
            .header-nav { gap: 10px; }

            .header-nav a {
                font-size: 11px; 
                white-space: nowrap; 
            } 

            .logo-image { height: 50px; }
        }

    </style>
</head>
<body>

    <!-- Nav bar -->
  <header class="main-header">
        <div class="header-container">
            
            <nav class="header-nav">
                <a href="allitems.html">All Items</a>
            </nav>

            <div class="header-logo">
                <a href="index.html">
                    <img src="image/Kicks.png" alt="Logo" class="logo-image">
                </a>
            </div>

            <nav class="header-nav">
                <a href="about.html">About</a>
                <span class="con contact-link-wrapper">
                    <a href="contact.html">Contact</a>
                </span>
            </nav>

        </div>
    </header>

    <main class="container hero-container">
<div class="hero-banner" onclick="showLoginPrompt()" style="cursor: pointer;">  
              <div class="hero-content">
                <h3>FROM COURT TO THE STREETS!</h3>
                <h1>THE SNEAKER VAULT</h1>
                <h2></h2>
               
            </div>
        </section>
    </main>
    <script>
        /* --- Show Login popup --- */
        function showLoginPrompt() {
            /* Opens a  popup box with Yes/No choices */
            const userChoice = confirm("Welcome to Kicks EveryWear! Join our sneakerhead community to unlock exclusive archives. Would you like to log in or sign up now?");
            
            if (userChoice) {
                /* if user click yes they will be directed to the register page */
                window.location.href = "register.html"; 
            }
         
        }
    </script>

</body>
</html>
